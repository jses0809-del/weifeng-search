<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Weifeng Search</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', arial, sans-serif; margin: 0; background: #fff; }
        
        /* 右上角導航列 */
        .navbar { display: flex; justify-content: flex-end; align-items: center; padding: 15px 20px; position: relative; z-index: 10; }
        .login-btn { background: #1a73e8; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; }
        .login-btn:hover { background: #1869d1; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* 中央搜尋區 */
        .main { display: flex; flex-direction: column; align-items: center; margin-top: 120px; }
        .brand-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .logo { width: 80px; height: auto; } /* Logo 縮小了 */
        .brand-name { font-size: 32px; color: #444; font-weight: 500; }

        .search-container { position: relative; width: 100%; max-width: 580px; text-align: center; }
        .search-box { width: 100%; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; font-size: 16px; box-sizing: border-box; }
        .search-box:focus { box-shadow: 0 1px 6px rgba(32,33,36,.28); border-color: rgba(223,225,229,0); }

        /* 登入遮罩層 */
        #auth-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.98); z-index: 999; justify-content: center; align-items: center; 
        }
        .auth-card { width: 400px; border: 1px solid #dadce0; border-radius: 8px; padding: 40px; text-align: center; background: white; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .next-btn { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="navbar">
        <span id="user-info" style="margin-right:15px; font-size:14px; color:#5f6368;"></span>
        <button class="login-btn" id="main-login-btn" onclick="openAuth()">登入</button>
    </div>

    <div class="main">
        <div class="brand-area">
            <img src="logo.png" alt="Logo" class="logo">
            <span class="brand-name">Weifeng Search</span>
        </div>
        <div class="search-container">
            <input type="text" id="main-search" class="search-box" placeholder="在 Weifeng 上搜尋...">
            <div id="history-display" style="margin-top:25px; text-align:left; font-size:14px; color:#3c4043;"></div>
        </div>
    </div>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="step-title">登入</h2>
            <p id="step-desc">使用您的 Weifeng 帳號</p>

            <div id="step-1">
                <div style="position:relative;">
                    <input type="text" id="account-id" class="auth-input" placeholder="帳號">
                    <span style="position:absolute; right:12px; top:22px; color:#70757a; font-weight:bold;">@weifeng.tw</span>
                </div>
                <div style="text-align:left; font-size:13px; color:#1a73e8; margin-top:8px; cursor:pointer;" onclick="toggleToRegister()">建立帳號</div>
                <button class="next-btn" onclick="showPasswordStep()">下一步</button>
            </div>

            <div id="step-2" style="display:none;">
                <div id="target-email" style="margin-bottom:15px; font-weight:500;"></div>
                <input type="password" id="account-pw" class="auth-input" placeholder="輸入您的密碼">
                <button class="next-btn" onclick="submitAuth()">完成</button>
            </div>
            
            <p onclick="closeAuth()" style="color:#5f6368; font-size:14px; cursor:pointer; margin-top:20px;">取消</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
