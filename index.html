<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>微風搜尋 Weifeng Search</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: arial, sans-serif; margin: 0; padding: 0; }
        /* 右上角導航 */
        .navbar { display: flex; justify-content: flex-end; padding: 15px; }
        .login-btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* 中央搜尋區 */
        .main { display: flex; flex-direction: column; align-items: center; margin-top: 150px; }
        .logo { width: 272px; margin-bottom: 30px; }
        .search-box { width: 480px; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; font-size: 16px; }
        .search-box:hover { box-shadow: 0 1px 6px rgba(32,33,36,.28); }

        /* 隱藏的登入彈窗 */
        #auth-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; justify-content: center; align-items: center; }
        .auth-card { width: 450px; border: 1px solid #dadce0; border-radius: 8px; padding: 40px; text-align: center; }
        .auth-input { width: 100%; padding: 13px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .next-btn { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="login-btn" id="nav-login-btn" onclick="openAuth()">登入</button>
        <span id="user-display" style="display:none; margin-right:20px; align-self:center;"></span>
    </div>

    <div class="main">
        <img src="logo.png" alt="Weifeng Logo" class="logo">
        <input type="text" id="main-q" class="search-box" placeholder="在微風上搜尋...">
        <div id="history-box" style="margin-top:20px; width:480px;"></div>
    </div>

    <div id="auth-overlay">
        <div class="auth-card">
            <img src="logo.png" width="100" style="margin-bottom:10px;">
            <h2 id="auth-title">登入</h2>
            <p id="auth-subtitle">使用您的微風帳號</p>

            <div id="step-1">
                <div style="display:flex; align-items:center;">
                    <input type="text" id="acc-name" class="auth-input" placeholder="帳號">
                    <span style="margin-left:-110px; color:#5f6368; font-weight:bold;">@weifeng.tw</span>
                </div>
                <div style="text-align:left; color:#1a73e8; cursor:pointer; font-size:14px; margin-top:10px;" onclick="isSignUp=true; alert('請輸入您想註冊的帳號後點擊下一步')">建立帳號</div>
                <button class="next-btn" onclick="toStep2()">下一步</button>
            </div>

            <div id="step-2" style="display:none;">
                <div id="display-email" style="background:#f8f9fa; padding:10px; border-radius:20px; margin-bottom:20px;"></div>
                <input type="password" id="acc-pw" class="auth-input" placeholder="輸入您的密碼">
                <button class="next-btn" onclick="finishAuth()">登入 / 註冊</button>
            </div>
            
            <button onclick="closeAuth()" style="margin-top:20px; background:none; border:none; color:#5f6368; cursor:pointer;">取消</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
