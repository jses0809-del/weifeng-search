<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Weifeng Search - 搜尋結果</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', arial, sans-serif; margin: 0; background: #fff; }
        .header { display: flex; align-items: center; padding: 15px 30px; border-bottom: 1px solid #ebebeb; position: sticky; top: 0; background: white; }
        .logo-small { width: 35px; height: auto; cursor: pointer; margin-right: 20px; }
        .res-input { width: 500px; padding: 10px 20px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
        .content { padding: 20px 85px; max-width: 700px; }
        .item { margin-bottom: 30px; }
        .item-title { font-size: 20px; color: #1a0dab; text-decoration: none; }
        .item-title:hover { text-decoration: underline; }
        .item-snippet { font-size: 14px; color: #4d5156; margin-top: 5px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" class="logo-small" onclick="location.href='index.html'">
        <input type="text" id="top-search" class="res-input">
    </div>
    <div class="content" id="results-list">
        <p>🔍 正在準備搜尋結果...</p>
    </div>

    <script>
        const q = new URLSearchParams(window.location.search).get('q');
        const input = document.getElementById('top-search');
        if(q) { input.value = q; fetchResults(q); }

        input.addEventListener('keypress', e => {
            if(e.key === 'Enter') window.location.href = `results.html?q=${encodeURIComponent(input.value)}`;
        });

        async function fetchResults(query) {
            const list = document.getElementById('results-list');
            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
                const data = await res.json();
                list.innerHTML = "";
                
                if(data.AbstractText) {
                    list.innerHTML += `<div class="item"><h3>${data.Heading}</h3><p>${data.AbstractText}</p></div><hr>`;
                }
                data.RelatedTopics.forEach(t => {
                    if(t.Text) {
                        list.innerHTML += `
                        <div class="item">
                            <a class="item-title" href="${t.FirstURL}" target="_blank">${t.Text.split(' - ')[0]}</a>
                            <p class="item-snippet">${t.Text}</p>
                        </div>`;
                    }
                });
            } catch(e) { list.innerHTML = "無法取得結果。"; }
        }
    </script>
</body>
</html>
