<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Weifeng Search - 搜尋結果</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', arial, sans-serif; margin: 0; background: #fff; color: #202124; }
        .header { display: flex; align-items: center; padding: 15px 30px; border-bottom: 1px solid #ebebeb; position: sticky; top: 0; background: white; z-index: 1000; }
        .logo-small { width: 35px; height: auto; cursor: pointer; margin-right: 20px; }
        .res-input { width: 100%; max-width: 500px; padding: 10px 20px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; font-size: 16px; }
        .content { padding: 20px 85px; max-width: 700px; }
        .item { margin-bottom: 30px; }
        .item-title { font-size: 20px; color: #1a0dab; text-decoration: none; font-weight: 500; display: block; }
        .item-title:hover { text-decoration: underline; }
        .item-url { font-size: 14px; color: #006621; display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-snippet { font-size: 14px; color: #4d5156; margin-top: 5px; line-height: 1.5; }
        #status { color: #70757a; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" class="logo-small" onclick="location.href='index.html'">
        <input type="text" id="top-search" class="res-input" placeholder="在 Weifeng 上搜尋...">
    </div>
    <div class="content" id="results-list">
        <p id="status">🔍 Weifeng 正在為您提取資料...</p>
    </div>

    <script>
        const q = new URLSearchParams(window.location.search).get('q');
        const input = document.getElementById('top-search');
        
        if (q) {
            input.value = q;
            fetchFromSerper(q);
        }

        input.addEventListener('keypress', e => {
            if (e.key === 'Enter' && input.value.trim()) {
                window.location.href = `results.html?q=${encodeURIComponent(input.value)}`;
            }
        });

        async function fetchFromSerper(query) {
            const list = document.getElementById('results-list');
            // 這裡使用的是你剛才提供的 API KEY
            const apiKey = "b8cdaab7fd01e7a8cd78ce3c164e5fe1d042446b"; 

            try {
                const response = await fetch("https://google.serper.dev/search", {
                    method: "POST",
                    headers: {
                        "X-API-KEY": apiKey,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        "q": query,
                        "gl": "tw", // 設定地區為台灣
                        "hl": "zh-tw" // 設定語言為繁體中文
                    })
                });
                
                const data = await response.json();
                list.innerHTML = ""; // 清空載入中狀態

                // 處理搜尋結果 (Organic results)
                if (data.organic && data.organic.length > 0) {
                    data.organic.forEach(result => {
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.innerHTML = `
                            <a class="item-title" href="${result.link}" target="_blank">${result.title}</a>
                            <span class="item-url">${result.link}</span>
                            <p class="item-snippet">${result.snippet || ""}</p>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = "<p>找不到關於「" + query + "」的搜尋結果。</p>";
                }
            } catch (e) {
                console.error(e);
                list.innerHTML = "<p>搜尋服務暫時無法連線，請檢查 API Key 或網路狀態。</p>";
            }
        }
    </script>
</body>
</html>
