<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>搜尋結果 - Weifeng Search</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', arial, sans-serif; margin: 0; background: #fff; }
        .header { display: flex; align-items: center; padding: 15px 30px; border-bottom: 1px solid #ebebeb; position: sticky; top: 0; background: white; z-index: 1000; }
        .logo-small { width: 35px; margin-right: 20px; cursor: pointer; }
        .search-bar { display: flex; flex: 1; max-width: 600px; border: 1px solid #dfe1e5; border-radius: 24px; padding: 2px 15px; align-items: center; }
        .res-input { flex: 1; border: none; padding: 10px; outline: none; font-size: 16px; }
        .res-btn { background: #1a73e8; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        
        .content { padding: 20px 20px 20px 85px; max-width: 700px; }
        .item { margin-bottom: 28px; }
        .item-title { font-size: 20px; color: #1a0dab; text-decoration: none; display: block; }
        .item-title:hover { text-decoration: underline; }
        .item-url { color: #006621; font-size: 14px; }
        .item-snippet { color: #4d5156; font-size: 14px; line-height: 1.5; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" class="logo-small" onclick="location.href='index.html'">
        <div class="search-bar">
            <input type="text" id="top-search" class="res-input">
            <button class="res-btn" onclick="triggerSearch()">搜尋</button>
        </div>
    </div>
    <div class="content" id="results-list">
        <p>🔍 正在搜尋...</p>
    </div>

    <script>
        const query = new URLSearchParams(window.location.search).get('q');
        const input = document.getElementById('top-search');
        if(query) { input.value = query; fetchSerper(query); }

        function triggerSearch() {
            if(input.value.trim()) window.location.href = `results.html?q=${encodeURIComponent(input.value)}`;
        }
        input.addEventListener('keypress', e => { if(e.key==='Enter') triggerSearch(); });

        async function fetchSerper(q) {
            const list = document.getElementById('results-list');
            try {
                const response = await fetch("https://google.serper.dev/search", {
                    method: "POST",
                    headers: { "X-API-KEY": "b8cdaab7fd01e7a8cd78ce3c164e5fe1d042446b", "Content-Type": "application/json" },
                    body: JSON.stringify({ q: q, gl: "tw", hl: "zh-tw" })
                });
                const data = await response.json();
                list.innerHTML = "";
                data.organic.forEach(res => {
                    list.innerHTML += `<div class="item">
                        <a class="item-title" href="${res.link}" target="_blank">${res.title}</a>
                        <span class="item-url">${res.link}</span>
                        <p class="item-snippet">${res.snippet}</p>
                    </div>`;
                });
            } catch(e) { list.innerHTML = "搜尋失敗。"; }
        }
    </script>
</body>
</html>
